name: publish RevitCopyStandarts

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitCopyStandarts**.cs'
      - '**RevitCopyStandarts**.xaml'
      - '**RevitCopyStandarts**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitCopyStandarts"
    secrets: inherit
