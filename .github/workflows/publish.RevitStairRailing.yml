name: publish RevitStairRailing

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitStairRailing**.cs'
      - '**RevitStairRailing**.xaml'
      - '**RevitStairRailing**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitStairRailing"
    secrets: inherit
