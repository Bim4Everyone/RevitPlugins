name: publish RevitOpeningPlacement

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitClashes**.cs'
      - '**RevitOpeningPlacement**.cs'
      - '**RevitOpeningPlacement**.xaml'
      - '**RevitOpeningPlacement**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitOpeningPlacement"
      use-devexpress: true
    secrets: inherit
