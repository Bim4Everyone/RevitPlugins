name: publish RevitRoomTagPlacement

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitRoomTagPlacement**.cs'
      - '**RevitRoomTagPlacement**.xaml'
      - '**RevitRoomTagPlacement**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitRoomTagPlacement"
    secrets: inherit
