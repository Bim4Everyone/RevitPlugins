name: publish RevitMarkAllDocuments

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitMarkAllDocuments**.cs'
      - '**RevitMarkAllDocuments**.xaml'
      - '**RevitMarkAllDocuments**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitMarkAllDocuments"
    secrets: inherit
