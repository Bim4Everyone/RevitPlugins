name: publish RevitSetCoordParams

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitSetCoordParams**.cs'
      - '**RevitSetCoordParams**.xaml'
      - '**RevitSetCoordParams**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitSetCoordParams"
    secrets: inherit
