name: publish RevitAxonometryViews

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitAxonometryViews**.cs'
      - '**RevitAxonometryViews**.xaml'
      - '**RevitAxonometryViews**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitAxonometryViews"
    secrets: inherit
