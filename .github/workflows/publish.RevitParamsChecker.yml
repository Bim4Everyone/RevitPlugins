name: publish RevitParamsChecker

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitParamsChecker**.cs'
      - '**RevitParamsChecker**.xaml'
      - '**RevitParamsChecker**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitParamsChecker"
    secrets: inherit
