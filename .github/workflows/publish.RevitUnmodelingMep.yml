name: publish RevitUnmodelingMep

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitUnmodelingMep**.cs'
      - '**RevitUnmodelingMep**.xaml'
      - '**RevitUnmodelingMep**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitUnmodelingMep"
    secrets: inherit
