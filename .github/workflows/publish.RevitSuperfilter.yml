name: publish RevitSuperfilter

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitSuperfilter**.cs'
      - '**RevitSuperfilter**.xaml'
      - '**RevitSuperfilter**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitSuperfilter"
      use-devexpress: true
    secrets: inherit
