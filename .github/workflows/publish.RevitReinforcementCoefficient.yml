name: publish RevitReinforcementCoefficient

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitReinforcementCoefficient**.cs'
      - '**RevitReinforcementCoefficient**.xaml'
      - '**RevitReinforcementCoefficient**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitReinforcementCoefficient"
    secrets: inherit
