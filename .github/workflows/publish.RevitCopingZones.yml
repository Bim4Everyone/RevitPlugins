name: publish RevitCopingZones

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitCopingZones**.cs'
      - '**RevitCopingZones**.xaml'
      - '**RevitCopingZones**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitCopingZones"
      use-devexpress: true
    secrets: inherit
