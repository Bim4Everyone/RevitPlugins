name: publish RevitDeclarations

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitDeclarations**.cs'
      - '**RevitDeclarations**.xaml'
      - '**RevitDeclarations**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitDeclarations"
    secrets: inherit
