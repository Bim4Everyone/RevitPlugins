name: publish RevitHideWorkset

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitHideWorkset**.cs'
      - '**RevitHideWorkset**.xaml'
      - '**RevitHideWorkset**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitHideWorkset"
    secrets: inherit
