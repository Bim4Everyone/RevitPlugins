name: publish RevitPylonLoadAreas

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitPylonLoadAreas**.cs'
      - '**RevitPylonLoadAreas**.xaml'
      - '**RevitPylonLoadAreas**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitPylonLoadAreas"
    secrets: inherit
