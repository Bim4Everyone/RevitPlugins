name: publish RevitKrChecker

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitKrChecker**.cs'
      - '**RevitKrChecker**.xaml'
      - '**RevitKrChecker**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitKrChecker"
    secrets: inherit
