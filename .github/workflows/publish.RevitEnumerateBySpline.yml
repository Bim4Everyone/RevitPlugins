name: publish RevitEnumerateBySpline

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitEnumerateBySpline**.cs'
      - '**RevitEnumerateBySpline**.xaml'
      - '**RevitEnumerateBySpline**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitEnumerateBySpline"
    secrets: inherit
