name: publish RevitCorrectNamingCheck

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitCorrectNamingCheck**.cs'
      - '**RevitCorrectNamingCheck**.xaml'
      - '**RevitCorrectNamingCheck**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitCorrectNamingCheck"
    secrets: inherit
