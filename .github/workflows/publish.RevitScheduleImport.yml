name: publish RevitScheduleImport

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitScheduleImport**.cs'
      - '**RevitScheduleImport**.xaml'
      - '**RevitScheduleImport**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitScheduleImport"
    secrets: inherit
