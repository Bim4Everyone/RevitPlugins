name: publish RevitExportSpecToJson

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitExportSpecToJson**.cs'
      - '**RevitExportSpecToJson**.xaml'
      - '**RevitExportSpecToJson**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitExportSpecToJson"
    secrets: inherit
