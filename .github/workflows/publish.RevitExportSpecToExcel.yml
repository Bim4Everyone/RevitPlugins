name: publish RevitExportSpecToExcel

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitExportSpecToExcel**.cs'
      - '**RevitExportSpecToExcel**.xaml'
      - '**RevitExportSpecToExcel**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitExportSpecToExcel"
    secrets: inherit
