name: publish RevitMepTotals

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitMepTotals**.cs'
      - '**RevitMepTotals**.xaml'
      - '**RevitMepTotals**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitMepTotals"
    secrets: inherit
