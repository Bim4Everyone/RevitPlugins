name: publish RevitPlugins

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitPlugins**.cs'
      - '**RevitPlugins**.xaml'
      - '**RevitPlugins**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitPlugins"
    secrets: inherit
