name: publish RevitValueModifier

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitValueModifier**.cs'
      - '**RevitValueModifier**.xaml'
      - '**RevitValueModifier**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitValueModifier"
    secrets: inherit
