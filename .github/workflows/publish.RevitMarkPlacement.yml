name: publish RevitMarkPlacement

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitMarkPlacement**.cs'
      - '**RevitMarkPlacement**.xaml'
      - '**RevitMarkPlacement**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitMarkPlacement"
    secrets: inherit
