name: publish RevitRoomAnnotations

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitRoomAnnotations**.cs'
      - '**RevitRoomAnnotations**.xaml'
      - '**RevitRoomAnnotations**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitRoomAnnotations"
    secrets: inherit
