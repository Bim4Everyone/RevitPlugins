name: publish RevitIsolateByParameter

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitIsolateByParameter**.cs'
      - '**RevitIsolateByParameter**.xaml'
      - '**RevitIsolateByParameter**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitIsolateByParameter"
    secrets: inherit
