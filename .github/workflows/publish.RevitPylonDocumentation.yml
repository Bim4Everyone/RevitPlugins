name: publish RevitPylonDocumentation

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitPylonDocumentation**.cs'
      - '**RevitPylonDocumentation**.xaml'
      - '**RevitPylonDocumentation**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitPylonDocumentation"
    secrets: inherit
