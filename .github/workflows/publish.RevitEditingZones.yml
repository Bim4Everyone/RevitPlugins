name: publish RevitEditingZones

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitEditingZones**.cs'
      - '**RevitEditingZones**.xaml'
      - '**RevitEditingZones**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitEditingZones"
      use-devexpress: true
    secrets: inherit
