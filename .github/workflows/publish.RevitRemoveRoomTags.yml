name: publish RevitRemoveRoomTags

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitRemoveRoomTags**.cs'
      - '**RevitRemoveRoomTags**.xaml'
      - '**RevitRemoveRoomTags**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitRemoveRoomTags"
    secrets: inherit
