name: publish RevitVolumeModifier

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitVolumeModifier**.cs'
      - '**RevitVolumeModifier**.xaml'
      - '**RevitVolumeModifier**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitVolumeModifier"
    secrets: inherit
