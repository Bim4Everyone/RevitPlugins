name: publish RevitGenLookupTables

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitGenLookupTables**.cs'
      - '**RevitGenLookupTables**.xaml'
      - '**RevitGenLookupTables**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitGenLookupTables"
    secrets: inherit
