name: publish RevitArchitecturalDocumentation

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitArchitecturalDocumentation**.cs'
      - '**RevitArchitecturalDocumentation**.xaml'
      - '**RevitArchitecturalDocumentation**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitArchitecturalDocumentation"
    secrets: inherit
