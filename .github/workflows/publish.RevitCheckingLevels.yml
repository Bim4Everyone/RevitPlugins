name: publish RevitCheckingLevels

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitCheckingLevels**.cs'
      - '**RevitCheckingLevels**.xaml'
      - '**RevitCheckingLevels**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitCheckingLevels"
      use-devexpress: true
    secrets: inherit
