name: publish RevitBatchPrint

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitBatchPrint**.cs'
      - '**RevitBatchPrint**.xaml'
      - '**RevitBatchPrint**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitBatchPrint"
      use-devexpress: true
    secrets: inherit
