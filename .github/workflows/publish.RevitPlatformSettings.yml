name: publish RevitPlatformSettings

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitPlatformSettings**.cs'
      - '**RevitPlatformSettings**.xaml'
      - '**RevitPlatformSettings**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitPlatformSettings"
      use-devexpress: true
    secrets: inherit
