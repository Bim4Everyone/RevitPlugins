name: publish RevitDocumenter

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitDocumenter**.cs'
      - '**RevitDocumenter**.xaml'
      - '**RevitDocumenter**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitDocumenter"
    secrets: inherit
