name: publish RevitRsnManager

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitRsnManager**.cs'
      - '**RevitRsnManager**.xaml'
      - '**RevitRsnManager**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitRsnManager"
    secrets: inherit
