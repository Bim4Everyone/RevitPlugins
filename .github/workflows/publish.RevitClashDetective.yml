name: publish RevitClashDetective

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitClashes**.cs'
      - '**RevitClashDetective**.cs'
      - '**RevitClashDetective**.xaml'
      - '**RevitClashDetective**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitClashDetective"
      use-devexpress: true
    secrets: inherit
