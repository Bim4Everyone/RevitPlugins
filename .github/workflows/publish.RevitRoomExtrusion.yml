name: publish RevitRoomExtrusion

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitRoomExtrusion**.cs'
      - '**RevitRoomExtrusion**.xaml'
      - '**RevitRoomExtrusion**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitRoomExtrusion"
    secrets: inherit
