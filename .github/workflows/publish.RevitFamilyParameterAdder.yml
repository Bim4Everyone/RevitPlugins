name: publish RevitFamilyParameterAdder

on:
  workflow_dispatch:
  pull_request:
    types: [ closed, synchronize, review_requested ]
    branches: [ main, master ]
    paths:
      - '**RevitFamilyParameterAdder**.cs'
      - '**RevitFamilyParameterAdder**.xaml'
      - '**RevitFamilyParameterAdder**.csproj'

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      plugin-name: "RevitFamilyParameterAdder"
    secrets: inherit
